env:
    es6: true
    jest: true
extends:
    - "eslint:recommended"
    - "plugin:@typescript-eslint/eslint-recommended"
    - "plugin:@typescript-eslint/recommended-type-checked"
    - "plugin:@typescript-eslint/stylistic-type-checked"
    - "plugin:import/recommended"
    - "plugin:import/typescript"
    - "plugin:jsdoc/recommended"
    - "plugin:no-unsanitized/recommended-legacy"
    - "plugin:unicorn/recommended"
    - prettier
parser: "@typescript-eslint/parser"
parserOptions:
    project: "./tsconfig.eslint.json"
    sourceType: module
plugins:
    - "@typescript-eslint"
    - deprecation
    - import
    - jsdoc
    - no-unsanitized
    - prefer-arrow
    - unicorn
ignorePatterns:
    - "**/dist/**"
    - "**/*.d.ts"
    - "**/*.js"
rules:
    ##### Rejected rules
    # We use namespaces for specific purposes
    "@typescript-eslint/no-namespace": "off"
    # TS gives us this already with noUnusedLocals and noUnusedParameters
    "@typescript-eslint/no-unused-vars": "off"
    # Reduce is useful
    unicorn/no-reduce: "off"
    # Don't want to rename "params" to "parameters"
    unicorn/prevent-abbreviations: "off"

    ##### Tweaked rules
    unicorn/filename-case:
        - "error"
        - case: "kebabCase"

    ##### Additional rules
    "@typescript-eslint/array-type": error
    "@typescript-eslint/consistent-type-assertions": error
    "@typescript-eslint/consistent-type-definitions": error
    # TODO: re-enable after renaming class props to avoid dot notation issues
    "@typescript-eslint/dot-notation": off
    "@typescript-eslint/explicit-member-accessibility": off
    # TODO: re-enable after renaming UPPER_CASE class props,
    # "@typescript-eslint/naming-convention":
    #     - "warn"
    #     - selector: default
    #       format:
    #           - strictCamelCase
    #       leadingUnderscore: allow
    #     - selector: variable
    #       modifiers:
    #           - const
    #       format:
    #           - strictCamelCase
    #           - UPPER_CASE
    #       leadingUnderscore: allow
    #     - selector: typeLike
    #       format:
    #           - StrictPascalCase
    "@typescript-eslint/naming-convention": "off"
    "@typescript-eslint/no-unused-expressions": error
    "@typescript-eslint/prefer-for-of": error
    "@typescript-eslint/prefer-function-type": error
    "@typescript-eslint/promise-function-async": error
    "@typescript-eslint/unified-signatures": error
    arrow-body-style: error
    curly: error
    deprecation/deprecation: "warn"
    eqeqeq: error
    guard-for-in: error
    id-denylist:
        - error
        - any
        - Number
        - number
        - String
        - string
        - Boolean
        - boolean
        - Undefined
        - undefined
    id-match: error
    import/no-deprecated: error
    import/order: error
    no-caller: error
    no-eval: error
    no-new-func: error
    no-new-wrappers: error
    no-octal-escape: error
    # See https://eslint.org/docs/developer-guide/selectors and https://astexplorer.net/ for help editing these
    no-restricted-syntax:
        - "error"
        - selector: "MemberExpression[object.name='Math'][property.name='random']"
          message: "Do not use Math.random. Use crypto.getRandomValues"
        - selector: "AssignmentExpression Identifier[name='innerHTML']"
          message: "Do not use innerHTML"
        - selector: ":matches(MemberExpression[object.name='document'][property.name='write'], MemberExpression[object.object.name='window'][object.property.name='document'][property.name='write'])"
          message: "Do not use document.write"
        - selector: ":matches(MemberExpression[object.name='document'][property.name='domain'], MemberExpression[object.object.name='window'][object.property.name='document'][property.name='domain'])"
          message: "Do not use document.domain"
        - selector: "Literal[value^='http:']:not([value^='http://localhost'])"
          message: "Use https instead of http (localhost allowed)."
    no-shadow:
        - error
        - builtinGlobals: true
          hoist: all
    no-throw-literal: error
    no-undef-init: error
    object-shorthand: error
    one-var:
        - error
        - never
    # TODO: re-enable. Currently failing on a named function in client.ts.
    prefer-arrow/prefer-arrow-functions: off
    radix: error

    ##### Temporarily disabled
    # TODO: re-enable these after fixing the underlying issues.
    # The rules below are flagged by lint today. They're disabled to get to a green baseline
    "@typescript-eslint/ban-ts-comment": "off"
    unicorn/prefer-node-protocol: "off"
    unicorn/throw-new-error: "off"
    unicorn/new-for-builtins: "off"
    unicorn/no-useless-promise-resolve-reject: "off"
    unicorn/no-useless-spread: "off"
    unicorn/prefer-includes: "off"
    unicorn/prefer-spread: "off"
    unicorn/prefer-ternary: "off"
    unicorn/prefer-logical-operator-over-ternary: "off"
    unicorn/no-typeof-undefined: "off"
    unicorn/prefer-string-replace-all: "off"
    unicorn/better-regex: "off"
    unicorn/no-null: "off"
    unicorn/prefer-module: "off"
    unicorn/numeric-separators-style: "off"
    unicorn/no-static-only-class: "off"             # catch (e) → catch (error)
    unicorn/consistent-function-scoping: "off"
    "@typescript-eslint/no-explicit-any": "off"
    import/no-named-as-default-member: "off"
    jsdoc/require-param-description: "off"
    jsdoc/require-returns-description: "off"
    jsdoc/require-returns: "off"
    jsdoc/require-param-type: "off"
    jsdoc/require-jsdoc: "off"
    jsdoc/tag-lines: "off"
    jsdoc/check-tag-names: "off"
    "@typescript-eslint/prefer-nullish-coalescing": "off"
    "@typescript-eslint/no-unsafe-assignment": "off"
    "@typescript-eslint/no-unsafe-member-access": "off"
    "@typescript-eslint/no-unsafe-call": "off"
    "@typescript-eslint/no-unsafe-argument": "off"
    "@typescript-eslint/no-unsafe-return": "off"
    "@typescript-eslint/unbound-method": "off"
    "@typescript-eslint/prefer-optional-chain": "off"
    "@typescript-eslint/consistent-indexed-object-style": "off"
    "@typescript-eslint/no-inferrable-types": "off"
