name: Release SDK if needed

# npm publishing uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# The trusted publisher on npmjs.com is bound to this file (release.yml) and the
# `connect-sdk-js` environment; renaming either breaks publishing.

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.head.ref, 'release/')
    # Must match the environment on the npm trusted publisher config.
    environment: connect-sdk-js
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          # No registry-url: it writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # which trusted publishing doesn't use. npm defaults to registry.npmjs.org.

      # Trusted publishing needs npm >= 11.5.1; older npm silently skips OIDC and
      # fails later with ENEEDAUTH, so fail fast with a clear message instead.
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version)
          echo "npm $v"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v" \
            || { echo "::error::npm $v is too old for trusted publishing (need >= 11.5.1)"; exit 1; }

      - run: npm install
      # No token: npm exchanges the job's OIDC token for a short-lived publish
      # token and adds a provenance attestation automatically.
      - name: Publish to npm
        run: npm publish
      - name: Create Release tag
        id: create-tag
        env:
          PR_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          release_tag=$(echo "$PR_REF" | cut -d "/" -f2)
          echo "::set-output name=release-tag::$release_tag"
      - name: Make new release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.create-tag.outputs.release-tag }}
          commit: main
          body: ${{ github.event.pull_request.body }}
